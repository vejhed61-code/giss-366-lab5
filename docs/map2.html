<!DOCTYPE html>
<html>
<head>
    <title>Atlanta, Georgia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.css" />
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@watergis/maplibre-gl-terradraw@1.0.1/dist/maplibre-gl-terradraw.css"
/>
    <style>
        body { margin: 0; }
        #map { position: absolute; top: 0; right: 0; bottom: 0; left: 0; }
    </style>
    </head>
<body>
    <div id="map"></div>
    <script src="https://cdn.jsdelivr.net/npm/@watergis/maplibre-gl-terradraw@1.0.1/dist/maplibre-gl-terradraw.umd.js"></script>

    <script type="module">
        /*CUSTOMIZATIONS
        1. Centering map on Atlanta instead of template location.
        2. Customizing camera with zoom, pitch, and bearing.
        3. Adding map controls.
        */
        import * as maplibregl from 'https://unpkg.com/maplibre-gl@^6.10.0/dist/maplibre-gl.mjs';

        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/positron',
            center: [-84.3863, 33.7537],   // [lng, lat]
            zoom: 12,
            pitch: 45,
            bearing: 90
        });
        window.map = map;
        map.on('load', function () {
          map.addControl(new maplibregl.NavigationControl(), 'top-left');  
          map.addControl(new maplibregl.ScaleControl(), 'bottom-left');
          map.addControl(new maplibregl.FullscreenControl(), 'top-right');
          const draw = new MaplibreTerradrawControl.MaplibreTerradrawControl({
            modes: [
                'point',
                'linestring',
                'polygon',
                'rectangle'
          ],
          open: true,
        });
        map.addControl(draw, 'top-left');
        });

    </script>
</body>
</html>
